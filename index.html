<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparkle Korea</title>
<meta name="description" content="Sparkle Korea — 일상에 작은 반짝임을 더하는 앱과 게임을 만듭니다.">
<meta property="og:title" content="Sparkle Korea">
<meta property="og:description" content="일상에 작은 반짝임을 더하는 앱과 게임을 만듭니다.">
<meta name="theme-color" content="#0b0c10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c10'/%3E%3Cpath d='M16 5l2.6 8.4L27 16l-8.4 2.6L16 27l-2.6-8.4L5 16l8.4-2.6z' fill='%23e7c989'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0c10;--card:#14151c;--line:rgba(231,201,137,.24);--line2:rgba(255,255,255,.07);--gold:#e7c989;--gold2:#f6e2b0;--text:#f2eee6;--muted:#a49e94}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
/* 밤하늘 반짝이 */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(70% 55% at 50% 0%,rgba(231,201,137,.12),transparent 70%),radial-gradient(60% 50% at 100% 100%,rgba(90,100,200,.10),transparent 70%)}
.sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.0;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){.sky i{animation:none;opacity:.4}}
main{position:relative;z-index:1;flex:1;width:100%;max-width:980px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
.brand svg{width:24px;height:24px;filter:drop-shadow(0 0 6px rgba(231,201,137,.7))}
.lang{font-size:13px;color:var(--muted);cursor:pointer;border:1px solid var(--line2);border-radius:20px;padding:5px 13px;background:none}
.hero{text-align:center;padding:110px 0 70px}
.star{width:64px;height:64px;margin:0 auto 26px;filter:drop-shadow(0 0 18px rgba(231,201,137,.8));animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.star{animation:none}}
h1{margin:0;font-size:clamp(40px,7vw,76px);letter-spacing:-1.5px;line-height:1.05;font-weight:800;color:#f1d48e;text-shadow:0 0 6px rgba(255,236,190,.55),0 0 18px rgba(231,201,137,.75),0 0 42px rgba(231,201,137,.5),0 0 80px rgba(231,201,137,.3);animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 6px rgba(255,236,190,.55),0 0 18px rgba(231,201,137,.75),0 0 42px rgba(231,201,137,.5),0 0 80px rgba(231,201,137,.3)}50%{text-shadow:0 0 8px rgba(255,240,200,.7),0 0 24px rgba(231,201,137,.9),0 0 56px rgba(231,201,137,.6),0 0 110px rgba(231,201,137,.38)}}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
.brand{color:#f1d48e;text-shadow:0 0 10px rgba(231,201,137,.6)}
.hero p{margin:18px auto 0;max-width:520px;color:var(--muted);font-size:clamp(15.5px,2vw,18.5px)}
h2{font-size:13px;letter-spacing:2px;color:var(--gold);font-weight:800;text-align:center;margin:0 0 22px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;max-width:760px;margin:0 auto}
.app{display:flex;gap:18px;align-items:center;padding:22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(231,201,137,.06),transparent 60%),var(--card);transition:transform .2s,box-shadow .2s,border-color .2s}
.app:hover{transform:translateY(-3px);border-color:rgba(231,201,137,.5);box-shadow:0 16px 40px rgba(0,0,0,.45),0 0 30px rgba(231,201,137,.12)}
.app img{width:68px;height:68px;border-radius:17px;flex:none;box-shadow:0 0 24px rgba(231,201,137,.25)}
.app b{display:block;font-size:19px}
.app span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.app em{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-style:normal;font-size:13px;font-weight:700;color:var(--gold)}
.app em svg{width:14px;height:14px}
.soon{opacity:.55;border-style:dashed;pointer-events:none}
.soon .ph{width:68px;height:68px;border-radius:17px;flex:none;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center}
.soon .ph svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.6}
footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:12.5px;padding:70px 20px 40px}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<main>
  <header>
    <div class="brand"><svg viewBox="0 0 24 24"><path d="M12 2l2 7.5L21.5 12 14 14l-2 8-2-8-7.5-2L10 9.5z" fill="#e7c989"/></svg>Sparkle Korea</div>
    <button class="lang" id="lang" type="button">English</button>
  </header>

  <section class="hero">
    <svg class="star" viewBox="0 0 24 24"><path d="M12 1.5l2.3 8.2 8.2 2.3-8.2 2.3-2.3 8.2-2.3-8.2-8.2-2.3 8.2-2.3z" fill="#e7c989"/></svg>
    <h1>Sparkle Korea</h1>
    <p data-t="sub">일상에 작은 반짝임을 더하는 앱과 게임을 만들어요.</p>
  </section>

  <h2 data-t="apps">APPS &amp; GAMES</h2>
  <div class="apps">
    <a class="app" href="https://calendar.sparklekorea.com/">
      <img src="calendar.png" alt="">
      <div>
        <b data-t="cal">스파클달력</b>
        <span data-t="calD">일정과 돈을 한 달력에서. 휴대폰 앱과 윈도우 PC 프로그램.</span>
        <em><span data-t="go">자세히 보기</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h9M8 4l4 4-4 4"/></svg></em>
      </div>
    </a>
    <div class="app soon" aria-hidden="true">
      <div class="ph"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
      <div><b data-t="next">다음 작품</b><span data-t="nextD">준비하고 있어요.</span></div>
    </div>
  </div>
</main>
<footer>© Sparkle Korea</footer>
<script>
// 반짝이는 별
(function () {
  var sky = document.getElementById('sky');
  for (var i = 0; i < 60; i++) {
    var s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
    s.style.animationDuration = (3 + Math.random() * 4).toFixed(2) + 's';
    if (Math.random() < 0.3) { s.style.width = s.style.height = '3px'; s.style.background = '#f6e2b0'; }
    sky.appendChild(s);
  }
})();
var EN = { sub: 'Apps and games that add a little sparkle to your day.', apps: 'APPS &amp; GAMES', cal: 'Sparkle Calendar', calD: 'Your schedule and money on one calendar. Phone app and Windows PC app.', go: 'Learn more', next: 'Next up', nextD: 'Coming soon.' };
var KO = {};
document.querySelectorAll('[data-t]').forEach(function (e) { KO[e.getAttribute('data-t')] = e.innerHTML; });
var lang = (navigator.language || 'ko').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en';
try { lang = localStorage.getItem('lang') || lang; } catch (e) {}
function apply() {
  var d = lang === 'en' ? EN : KO;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(function (e) { var k = e.getAttribute('data-t'); if (d[k] != null) e.innerHTML = d[k]; });
  document.getElementById('lang').textContent = lang === 'en' ? '한국어' : 'English';
}
document.getElementById('lang').onclick = function () { lang = lang === 'en' ? 'ko' : 'en'; try { localStorage.setItem('lang', lang); } catch (e) {} apply(); };
apply();
</script>
</body>
</html>
